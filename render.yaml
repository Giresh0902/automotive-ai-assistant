services:
  - type: web
    name: automotive-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_KEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: ADMIN_TOKEN, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
